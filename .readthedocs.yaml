# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - pandoc
    - graphviz
  jobs:
    post_checkout:
      # Ensure the repo isn't shallow so setuptools_scm can see the history
      - git fetch --unshallow || true
      # Explicitly fetch tags so the commit SHA is associated with the tag
      - git fetch --tags


# Build documentation in the "docs/" directory with Sphinx
# Read the Docs invokes sphinx-build directly, bypassing docs/Makefile, so the
# -W set in SPHINXOPTS there does not apply here; fail_on_warning is its equivalent.
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

# Optionally, but recommended,
# declare the Python requirements required to build your documentation
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
