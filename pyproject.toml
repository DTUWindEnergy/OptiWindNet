[build-system]
requires = [
    "setuptools>=80",
    "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "optiwindnet"
description = "Tool for designing and optimizing the electrical cable network of offshore wind farms"
authors = [ { name="DTU Wind Energy", email="mikf@dtu.dk" },
            { name="Mauricio Souza de Alencar", email="ma___@dtu.dk" },
            { name="Amir Arasteh", email="am___@dtu.dk" },
]
dynamic = ["version"]
keywords = ["optimization", "wind farm", "network", "routing"]
classifiers = [
    "Development Status :: 4 - Beta", 
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">= 3.11"
dependencies = [
    "bidict >=0.23.1",
    "bitarray >=3.4.2",
    "condeltri >=0.0.5",
    "darkdetect >=0.8.0",
    "esy.osm.pbf >=0.1.1",
    "hybgensea >=0.1.1",
    "makefun >=1.15.6",
    "matplotlib >=3.10.1",
    "networkx >=3.6",
    "numba >=0.62.1",
    "numpy >=2.0",
    "ortools >=9.14.6206",
    "peewee >=3.17",
    "Pyomo >=6.9.5",
    "PyYAML >=6.0.2",
    "scipy >=1.15.2",
    "shapely >=2.0.7",
    "svg.py >=1.6.0",
    "utm >=0.7",
]

[project.urls]
"Homepage" = "https://gitlab.windenergy.dtu.dk/TOPFARM/OptiWindNet"
"Documentation" = "https://optiwindnet.readthedocs.io/"
"Download" = "https://optiwindnet.readthedocs.io/stable/setup.html#installation"
"Issue Tracker" = "https://github.com/DTUWindEnergy/OptiWindNet/issues"
"Release Notes" = "https://github.com/DTUWindEnergy/OptiWindNet/tags"
# "Changelog" = "https://github.com/DTUWindEnergy/OptiWindNet/releases"
"Source" = "https://github.com/DTUWindEnergy/OptiWindNet"

[project.optional-dependencies]
solvers = [
    "cplex",
    "gurobipy",
    "highspy",
    "pyscipopt",
]
test  = [
    "coverage",
    "pytest",  # for testing
    "pytest-cov",  # for calculating coverage
    "pytest-xdist",  # for testing in parallel
    "psutil",  # memory profiling
    "memory_profiler",  # memory profiling
    "line_profiler",  # to check speed
    "prek",  # runs the checks in .pre-commit-config.yaml, locally and in CI
    # pyrefly and the third-party stub packages it needs, pinned exactly: a new stub
    # release routinely changes which errors are reported, and the `# pyrefly: ignore`
    # comments in the source are written against these versions. Type checking lives
    # here rather than in an extra of its own because it needs the same environment
    # the tests do -- it covers `tests/` and imports through `optiwindnet.MILP`.
    # ruff is deliberately absent: its version is pinned once, in the pre-commit
    # `rev:`, and prek supplies it.
    "pyrefly ==1.2.0",
    "types-networkx ==3.6.1.20260728",
    "types-peewee ==4.3.0.20260807",
    "types-shapely ==2.1.0.20260728",
    "optiwindnet[solvers]",
]
docs = [
    "sphinx",
    "nbsphinx", 
    "myst-parser",
    "myst-nb",
    "furo",
    "sphinx-versioned-docs",
    "sphinx-autoapi",
    "sphinx_copybutton", 
    "sphinx_sitemap", 
    # nbsphinx needs a `pandoc` executable; Linux/macOS get it from the system package
    # manager (see .gitlab-ci.yml and .readthedocs.yaml), Windows from this wheel.
    "pypandoc-binary; sys_platform == 'win32'",
    "setuptools-scm",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["optiwindnet*"]
# exclude = []

[tool.setuptools.package-data]
optiwindnet = ["data/*", "py.typed", "**/*.pyi"]

[tool.setuptools_scm]
version_file = "optiwindnet/version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:optiwindnet"]

[tool.black]
skip-string-normalization = true

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# This keeps all the defaults AND adds your new line-length rules
extend-select = ["E501", "W505"]
# N999 (snake_case module names) fires on `tests/test_MILP.py`, whose name mirrors the
# `optiwindnet/MILP/` package it exercises.
ignore = ["N999"]

[tool.ruff.lint.per-file-ignores]
# docs/conf.py embeds HTML and Jinja templates (nbsphinx_prolog) as raw strings,
# where a line break would alter the emitted markup and `# noqa` would be inserted
# into it verbatim. Line length is not meaningful there.
"docs/conf.py" = ["E501"]

[tool.pyrefly]
infer-with-first-use = false
# Check against the minimum supported Python rather than whatever interpreter happens
# to be active, so CI does not drift when its image is upgraded. Verified clean on
# 3.11 through 3.14.
python-version = "3.11"
# Notebooks are linted and formatted by ruff, which is notebook-aware, but not
# type-checked. Their errors are dominated by peewee backrefs, IPython's injected
# `display`, and optional dependencies (topfarm, py_wake, costmodels) that are not
# installed here. `project-excludes` appends to pyrefly's own defaults.
project-excludes = ["docs/notebooks/**"]
